<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to lorem..!</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="./style/login.css">
</head>
<body>

<div class="container-fluid vh-100 d-flex align-items-center justify-content-center bg-white">
  <div class="w-100" style="max-width:1050px;">

    <input type="radio" name="auth-tab" id="tab-login" class="tab-input" checked>
    <input type="radio" name="auth-tab" id="tab-register" class="tab-input">

    <div class="row g-0 rounded-4 overflow-hidden shadow-sm">

      <div class="col-lg-5 auth-image-col position-relative">
        <div class="hero-img hero-register position-absolute top-0 start-0 w-100 h-100 flex-column justify-content-end p-4 text-white"
             style="background-image:linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,.1) 55%), url('images/Rectangle\ 77\(1\).png   ');">
          <h2 class="fw-bold mb-0">Lorem Ipsum is simply</h2>
          <p class="mb-0 opacity-75">Lorem Ipsum is simply</p>
        </div>
        <div class="hero-img hero-login position-absolute top-0 start-0 w-100 h-100 flex-column justify-content-end p-4 text-white"
             style="background-image:linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,.1) 55%), url('images/Rectangle\ 77.png');">
          <h2 class="fw-bold mb-0">Lorem Ipsum is simply</h2>
          <p class="mb-0 opacity-75">Lorem Ipsum is simply</p>
        </div>
      </div>

      <div class="col-lg-7 d-flex flex-column align-items-center justify-content-center bg-white p-4 p-lg-5">
        <div class="w-100" style="max-width:340px;">

          <p class="text-center fw-semibold mb-3">Welcome to lorem..!</p>

          <div class="toggle-switch d-flex rounded-pill p-1 mb-4 mx-auto" style="max-width:260px;">
            <span class="slider rounded-pill"></span>
            <label for="tab-login" class="flex-fill text-center fw-semibold py-2 mb-0" ></a>Login</label>
            <label for="tab-register" class="flex-fill text-center fw-semibold py-2 mb-0">Register</label>
          </div>

          <p class="text-center text-muted small mb-4">
            Lorem Ipsum is simply dummy text of the printing and typesetting industry.
          </p>

          <div class="panel" id="login-panel">
            <form>
              <div class="mb-3">
                <label class="form-label fw-semibold">User name</label>
                <input type="text" class="form-control form-control-teal rounded-3 py-2"
                       placeholder="Enter your User name">
              </div>
              <div class="mb-2">
                <label class="form-label fw-semibold">Password</label>
                <div class="position-relative">
                  <input type="password" class="form-control form-control-teal rounded-3 py-2"
                         placeholder="Enter your Password">
                  <span class="position-absolute password-eye"></span>
                </div>
              </div>
              <div class="d-flex justify-content-between align-items-center my-3 small">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="rememberMe">
                  <label class="form-check-label" for="rememberMe">Remember me</label>
                </div>
                <a href="#" class="link-dark text-decoration-none">Forgot Password ?</a>
              </div>
               <a href="Home.html" class="btn btn-teal w-100 rounded-pill fw-semibold py-2 mt-2">Login</a>
            </form>
          </div>

          <div class="panel" id="register-panel">
            <form>
              <div class="mb-3">
                <label class="form-label fw-semibold">Email Address</label>
                <input type="email" class="form-control form-control-teal rounded-3 py-2"
                       placeholder="Enter your Email Address">
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">User name</label>
                <input type="text" class="form-control form-control-teal rounded-3 py-2"
                       placeholder="Enter your User name">
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <div class="position-relative">
                  <input type="password" class="form-control form-control-teal rounded-3 py-2"
                         placeholder="Enter your Password">
                  <span class="position-absolute password-eye"></span>
                </div>
              </div>
              <button type="submit" class="btn btn-teal w-100 rounded-pill fw-semibold py-2 mt-2">Register</button>
            </form>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>

</body>
</html>
